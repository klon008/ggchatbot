<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>OBS Song Request Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body.debug-mode {
      background: #14141f;
      overflow: auto;
    }
    #playerWrap {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }
    body.debug-mode #playerWrap {
      height: 55vh;
      min-height: 280px;
    }
    #playerInner {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: scaleY(0.06);
      transform-origin: center center;
      transition:
        opacity 0.42s ease-out,
        transform 0.48s cubic-bezier(0.34, 1.15, 0.64, 1);
      will-change: opacity, transform;
    }
    #playerWrap.is-visible {
      visibility: visible;
      pointer-events: auto;
    }
    #playerWrap.is-visible #playerInner {
      opacity: 1;
      transform: scaleY(1);
    }
    #player {
      width: 100%;
      height: 100%;
    }
    #player.is-hidden {
      /* Не display:none — иначе CEF/OBS часто глушит YouTube после возврата. */
      position: absolute !important;
      left: 0;
      top: 0;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      overflow: hidden !important;
      z-index: 0;
    }
    #ymAudio {
      display: none;
    }
    #ymCoverWrap {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, rgba(20, 20, 28, 0.35) 0%, rgba(0, 0, 0, 0.72) 100%);
      box-sizing: border-box;
      padding: 24px 24px 96px;
    }
    #ymCoverWrap.is-active {
      display: flex;
    }
    #ymCover {
      max-width: min(72vw, 720px);
      max-height: min(72vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      background: #1a1a22;
    }
    #nowPlaying {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 40px 20px 18px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.5) 55%, transparent 100%);
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      pointer-events: none;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease 0.12s, transform 0.35s ease 0.12s;
    }
    #playerWrap.is-visible #nowPlaying {
      opacity: 1;
      transform: translateY(0);
    }
    .now-playing-marquee {
      overflow: hidden;
      width: 100%;
      min-width: 0;
      font-size: clamp(26px, 4.2vw, 44px);
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }
    .now-playing-track {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      width: max-content;
      will-change: transform;
    }
    .now-playing-track.is-scrolling {
      animation: np-marquee var(--np-marquee-duration, 18s) linear infinite;
    }
    .now-playing-chunk {
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
      padding-right: 64px;
      flex-shrink: 0;
    }
    .now-playing-user {
      font-weight: 700;
      color: #ffd966;
    }
    .now-playing-sep {
      opacity: 0.55;
    }
    .now-playing-title {
      font-weight: 500;
    }
    @keyframes np-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    #debugPanel {
      display: none;
      position: relative;
      box-sizing: border-box;
      margin: 0;
      padding: 12px 14px 16px;
      min-height: 40vh;
      background: #0d0d14;
      border-top: 2px solid #3d3d5c;
      color: #e8e8f0;
      font-family: Consolas, "Cascadia Mono", "Segoe UI", monospace;
      font-size: 13px;
      line-height: 1.45;
    }
    body.debug-mode #debugPanel {
      display: block;
    }
    #debugPanel h2 {
      margin: 0 0 10px;
      font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif;
      color: #9ecbff;
    }
    #debugStatus {
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #1c1c2e;
      border-radius: 6px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      color: #b8b8d0;
    }
    #debugLog {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 32vh;
      overflow-y: auto;
    }
    #debugLog li {
      padding: 4px 0;
      border-bottom: 1px solid #222233;
      word-break: break-word;
    }
    #debugLog li:last-child {
      border-bottom: none;
    }
    #debugLog .log-time {
      color: #666680;
      margin-right: 8px;
    }
    #debugLog .log-info { color: #9ecbff; }
    #debugLog .log-warn { color: #ffd966; }
    #debugLog .log-error { color: #ff7b7b; }
    @media (prefers-reduced-motion: reduce) {
      #playerInner,
      #nowPlaying {
        transition: none;
      }
      .now-playing-track.is-scrolling {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="playerWrap">
    <div id="playerInner">
      <div id="player"></div>
      <audio id="ymAudio" preload="auto" playsinline></audio>
      <div id="ymCoverWrap" aria-hidden="true">
        <img id="ymCover" alt="" />
      </div>
      <div id="nowPlaying" aria-hidden="true">
        <div class="now-playing-marquee">
          <div class="now-playing-track" id="npTrack">
            <span class="now-playing-chunk" id="npChunkA">
              <span class="now-playing-user" id="npUser"></span>
              <span class="now-playing-sep">—</span>
              <span class="now-playing-title" id="npTitle"></span>
            </span>
            <span class="now-playing-chunk" id="npChunkB" aria-hidden="true" hidden>
              <span class="now-playing-user" id="npUserB"></span>
              <span class="now-playing-sep">—</span>
              <span class="now-playing-title" id="npTitleB"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside id="debugPanel" aria-live="polite">
    <h2>Debug — Song Request Player</h2>
    <p id="debugStatus">Инициализация…</p>
    <ul id="debugLog"></ul>
  </aside>

  <script src="player.js"></script>
</body>
</html>
