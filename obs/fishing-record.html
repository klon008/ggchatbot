<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Fishing Record</title>
  <style>
    :root {
      --enter-ms: 650ms;
      --exit-ms: 480ms;
      --banner-w: min(92vw, 1100px);
      --gold-top: #ffe566;
      --gold-bot: #e8a020;
      --stroke: #1a1208;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body.debug-mode {
      background: radial-gradient(circle at center, #1a1a28 0%, #0d0d14 70%);
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 2vw 4vh;
      box-sizing: border-box;
      pointer-events: none;
      visibility: hidden;
    }
    #stage.is-visible {
      visibility: visible;
    }

    #banner {
      position: relative;
      width: var(--banner-w);
      aspect-ratio: 1573 / 544;
      opacity: 0;
      transform: translateY(28px) scale(0.94);
      transition:
        opacity var(--enter-ms) ease,
        transform var(--enter-ms) cubic-bezier(0.22, 1, 0.36, 1);
    }
    #stage.is-visible #banner {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #stage.is-leaving #banner {
      opacity: 0;
      transform: translateY(18px) scale(0.97);
      transition:
        opacity var(--exit-ms) ease,
        transform var(--exit-ms) ease;
    }

    #fishArt {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      /* shadow только на картинке — иначе filter убивает FPS при анимации лучей */
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
    }

    /* Зона текста: свечение + подпись */
    #textArea {
      position: absolute;
      left: 50%;
      right: 6%;
      top: 6%;
      bottom: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 4%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.45s ease 0.2s, transform 0.45s ease 0.2s;
    }
    #stage.is-visible #textArea {
      opacity: 1;
      transform: translateY(0);
    }
    #stage.is-leaving #textArea {
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #sunGlow,
    #murkGlow {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 140%;
      height: 160%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    #murkGlow { display: none; }
    #stage.is-mermaid #sunGlow { display: none; }
    #stage.is-mermaid #murkGlow { display: block; }

    .sun-rays {
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 210, 90, 0.00) 0deg,
        rgba(255, 210, 90, 0.00) 8deg,
        rgba(255, 220, 120, 0.22) 10deg,
        rgba(255, 210, 90, 0.00) 14deg,
        rgba(255, 210, 90, 0.00) 22deg
      );
      -webkit-mask-image: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(0, 0, 0, 0.45) 42%,
        transparent 68%
      );
      mask-image: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(0, 0, 0, 0.45) 42%,
        transparent 68%
      );
      animation: sun-spin 18s linear infinite;
      will-change: transform;
    }
    .sun-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 55%;
      height: 55%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(255, 230, 140, 0.38) 0%,
        rgba(255, 190, 60, 0.16) 35%,
        transparent 70%
      );
      animation: sun-pulse 2.8s ease-in-out infinite;
      will-change: opacity, transform;
    }
    .sun-spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 240, 180, 0.9);
      box-shadow: 0 0 8px 2px rgba(255, 210, 100, 0.65);
      animation: sun-spark 3.2s ease-in-out infinite;
    }
    .sun-spark:nth-child(3) { left: 22%; top: 28%; animation-delay: 0s; }
    .sun-spark:nth-child(4) { left: 68%; top: 22%; animation-delay: 0.7s; width: 4px; height: 4px; }
    .sun-spark:nth-child(5) { left: 78%; top: 58%; animation-delay: 1.4s; }
    .sun-spark:nth-child(6) { left: 30%; top: 70%; animation-delay: 2.1s; width: 3px; height: 3px; }

    /* Негатив: глубинная муть вместо солнечных лучей */
    .murk-haze {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 95%;
      height: 90%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(
          ellipse at 40% 60%,
          rgba(48, 90, 110, 0.28) 0%,
          transparent 62%
        ),
        radial-gradient(
          ellipse at 70% 35%,
          rgba(70, 40, 90, 0.22) 0%,
          transparent 55%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(20, 40, 55, 0.18) 0%,
          transparent 70%
        );
      animation: murk-breathe 5.5s ease-in-out infinite;
      will-change: opacity, transform;
    }
    .murk-veil {
      position: absolute;
      inset: 8% 5%;
      background: linear-gradient(
        180deg,
        rgba(10, 18, 28, 0.08) 0%,
        rgba(30, 55, 70, 0.14) 45%,
        rgba(12, 22, 32, 0.22) 100%
      );
      animation: murk-drift 9s ease-in-out infinite alternate;
      will-change: opacity;
    }
    .murk-bubble {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(150, 210, 230, 0.35);
      background: rgba(120, 180, 200, 0.12);
      box-shadow: 0 0 6px rgba(80, 160, 180, 0.25);
      animation: murk-rise 5.8s ease-in infinite;
      opacity: 0;
    }
    .murk-bubble:nth-child(3) { left: 24%; bottom: 18%; width: 7px; height: 7px; animation-delay: 0s; }
    .murk-bubble:nth-child(4) { left: 42%; bottom: 12%; width: 4px; height: 4px; animation-delay: 1.4s; }
    .murk-bubble:nth-child(5) { left: 61%; bottom: 22%; width: 6px; height: 6px; animation-delay: 2.6s; }
    .murk-bubble:nth-child(6) { left: 78%; bottom: 16%; width: 5px; height: 5px; animation-delay: 3.8s; }

    @keyframes sun-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes sun-pulse {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(0.92); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes sun-spark {
      0%, 100% { opacity: 0.15; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes murk-breathe {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.96); }
      50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.04); }
    }
    @keyframes murk-drift {
      from { opacity: 0.45; }
      to { opacity: 0.8; }
    }
    @keyframes murk-rise {
      0% { opacity: 0; transform: translateY(10px) scale(0.7); }
      18% { opacity: 0.7; }
      70% { opacity: 0.35; }
      100% { opacity: 0; transform: translateY(-72px) scale(1.05); }
    }

    #caption {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.12em;
      box-sizing: border-box;
      font-family: "Segoe UI Black", "Arial Black", "Impact", "Segoe UI", system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .cap-nick {
      font-size: clamp(22px, 4.4vw, 48px);
      line-height: 1.05;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f2c43a;
      -webkit-text-stroke: 1.5px var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 1px 0 #7a4a08,
        0 3px 8px rgba(0, 0, 0, 0.8);
    }
    #stage.is-mermaid .cap-nick {
      color: #c5d8e8;
      text-shadow:
        0 1px 0 #1a3040,
        0 3px 10px rgba(0, 0, 0, 0.85);
    }
    #stage.is-mermaid .cap-verb-row::before,
    #stage.is-mermaid .cap-verb-row::after {
      background: linear-gradient(90deg, transparent, rgba(140, 190, 210, 0.45), transparent);
    }
    #stage.is-mermaid .cap-verb {
      color: #9eb8c8;
      letter-spacing: 0.22em;
    }
    .cap-loss {
      color: #e07070;
      -webkit-text-stroke: 1.5px var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 1px 0 #4a1010,
        0 3px 8px rgba(0, 0, 0, 0.85);
    }
    .cap-saved {
      color: #7ecf9a;
      -webkit-text-stroke: 1.5px var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 1px 0 #12301c,
        0 3px 8px rgba(0, 0, 0, 0.85);
    }
    #stage.is-mermaid .cap-fish {
      color: #d0d8e0;
    }

    .cap-verb-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
      width: 100%;
      margin: 0.05em 0 0.1em;
    }
    .cap-verb-row::before,
    .cap-verb-row::after {
      content: "";
      flex: 1;
      max-width: 4.5em;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    }
    .cap-verb {
      font-size: clamp(12px, 1.9vw, 20px);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f5f5f5;
      text-shadow: 0 1px 0 #000, 0 2px 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
    }

    .cap-catch {
      font-size: clamp(18px, 3.5vw, 38px);
      line-height: 1.1;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cap-weight,
    .cap-unit {
      color: #f2c43a;
      -webkit-text-stroke: 1.5px var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 1px 0 #7a4a08,
        0 3px 8px rgba(0, 0, 0, 0.8);
    }
    .cap-unit {
      font-size: 0.62em;
      margin-left: 0.12em;
      -webkit-text-stroke-width: 1px;
    }
    .cap-fish {
      margin-left: 0.28em;
      color: #f2f2f2;
      -webkit-text-stroke: 1.5px var(--stroke);
      paint-order: stroke fill;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
    }

    .cap-record {
      margin-top: 0.35em;
      padding: 0.28em 1.1em 0.32em;
      font-size: clamp(11px, 1.7vw, 18px);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1a1208;
      background: linear-gradient(180deg, #f6d24a 0%, #e0a018 55%, #c88810 100%);
      border-radius: 999px;
      box-shadow:
        0 2px 0 #8a5a08,
        0 4px 10px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 220, 0.55);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cap-record::before,
    .cap-record::after {
      content: "★";
      margin: 0 0.35em;
      font-size: 0.85em;
      opacity: 0.9;
    }
    .cap-record.is-bad {
      color: #d8e4ec;
      background: linear-gradient(180deg, #3a5568 0%, #243848 55%, #1a2a38 100%);
      box-shadow:
        0 2px 0 #0e1820,
        0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(160, 200, 220, 0.22);
    }
    .cap-record.is-bad::before,
    .cap-record.is-bad::after {
      content: "✦";
      opacity: 0.55;
    }
    .cap-record.is-ok {
      color: #e8f5ec;
      background: linear-gradient(180deg, #3a6850 0%, #244838 55%, #1a3028 100%);
      box-shadow:
        0 2px 0 #0e2018,
        0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(160, 220, 180, 0.22);
    }
    .cap-record.is-ok::before,
    .cap-record.is-ok::after {
      content: "✦";
      opacity: 0.55;
    }
    .cap-record.is-trophy {
      color: #1a1004;
      background: linear-gradient(180deg, #ffe08a 0%, #f0b020 40%, #d47808 100%);
      box-shadow:
        0 2px 0 #8a4a08,
        0 4px 14px rgba(240, 160, 20, 0.55),
        inset 0 1px 0 rgba(255, 255, 220, 0.7);
      letter-spacing: 0.12em;
    }
    .cap-record.is-trophy::before,
    .cap-record.is-trophy::after {
      content: "◆";
      opacity: 0.95;
    }

    aside#debugPanel {
      display: none;
      position: fixed;
      left: 12px;
      top: 12px;
      max-width: 420px;
      max-height: 40vh;
      overflow: auto;
      padding: 10px 12px;
      background: rgba(10, 10, 18, 0.92);
      border: 1px solid #3d3d5c;
      border-radius: 8px;
      color: #d8d8ec;
      font: 12px/1.45 Consolas, monospace;
      z-index: 20;
      pointer-events: none;
    }
    body.debug-mode aside#debugPanel {
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true">
    <div id="banner">
      <img id="fishArt" alt="" draggable="false" />
      <div id="textArea">
        <div id="sunGlow" aria-hidden="true">
          <div class="sun-rays"></div>
          <div class="sun-core"></div>
          <span class="sun-spark"></span>
          <span class="sun-spark"></span>
          <span class="sun-spark"></span>
          <span class="sun-spark"></span>
        </div>
        <div id="murkGlow" aria-hidden="true">
          <div class="murk-haze"></div>
          <div class="murk-veil"></div>
          <span class="murk-bubble"></span>
          <span class="murk-bubble"></span>
          <span class="murk-bubble"></span>
          <span class="murk-bubble"></span>
        </div>
        <div id="caption"></div>
      </div>
    </div>
  </div>

  <aside id="debugPanel">
    <strong style="color:#9ecbff;font-family:'Segoe UI',system-ui,sans-serif;">Debug — Fishing Record</strong>
    <div id="debugLog" style="margin-top:8px;"></div>
  </aside>

  <script src="/sfx.js"></script>
  <script src="/fishing-record.js"></script>
</body>
</html>
